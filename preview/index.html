<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · Codex Pet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2fb;color:#203451;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:960px;margin:48px auto;padding:0 24px}h1{margin:0;font-size:32px}p{color:#62718a}.stage{height:480px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#fff,#e2ebfc);border:1px solid #d4dff1;border-radius:20px;margin:24px 0}.pet{width:192px;height:208px;background-image:url('../pets/dafeiyu/spritesheet.webp');background-repeat:no-repeat;transform:scale(2);transform-origin:center}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;cursor:pointer;border:1px solid #c1d0e8;border-radius:9px;background:#fff;padding:8px 16px;color:#304a70}button[aria-pressed=true]{background:#244d91;border-color:#244d91;color:white}footer{margin:28px 0;font-size:13px;color:#75819a}a{color:#315ca4}.status{font-variant-numeric:tabular-nums}
</style>
<main><h1>大肥鱼</h1><p>DeepSeek鲸鱼娘社区同人 · Codex桌面宠物</p><div class="stage"><div class="pet" role="img" aria-label="大肥鱼动画"></div></div><nav aria-label="选择动作"></nav><p class="status" aria-live="polite"></p><button id="pause">暂停</button> <button id="theme">切换深色背景</button><footer>鲸鱼娘原作：上善无形 · DeepSeek女仆二次设计：ZipZipPipe<br>非官方同人作品 · CC BY-NC-SA 4.0 · <a href="../previews/contact-sheet.png">查看全部动作帧</a></footer></main>
<script>
const states=[['待机',[280,110,110,140,140,320]],['向右移动',[120,120,120,120,120,120,120,220]],['向左移动',[120,120,120,120,120,120,120,220]],['打招呼',[140,140,140,280]],['跳跃',[140,140,140,140,280]],['委屈',[140,140,140,140,140,140,140,240]],['等待回应',[150,150,150,150,150,260]],['认真工作',[120,120,120,120,120,220]],['检查结果',[150,150,150,150,150,280]]];
const pet=document.querySelector('.pet'),nav=document.querySelector('nav'),status=document.querySelector('.status');let row=0,frame=0,paused=false,timer;function paint(){pet.style.backgroundPosition=`${-frame*192}px ${-row*208}px`;status.textContent=`${states[row][0]} · 第${frame+1}/${states[row][1].length}帧`;document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',i===row));}function tick(){paint();clearTimeout(timer);if(!paused)timer=setTimeout(()=>{frame=(frame+1)%states[row][1].length;tick()},states[row][1][frame]);}states.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>{row=i;frame=0;tick()};nav.append(b)});document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'播放':'暂停';tick()};let dark=false;document.querySelector('#theme').onclick=()=>{dark=!dark;document.querySelector('.stage').style.background=dark?'#152237':'radial-gradient(ellipse at center,#fff,#e2ebfc)'};tick();
</script></html>
